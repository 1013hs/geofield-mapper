name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'
        cache: true

    - name: Install dependencies (Pub Get)
      run: flutter pub get

    - name: Clean, Re-create Android Template & Force Kotlin 1.9.0
      run: |
        rm -rf android
        flutter create . --platforms=android --project-name=geofield_mapper
        
        # 强制将生成的 android/build.gradle 中的 kotlin 版本改为 1.9.0
        if [ -f "android/build.gradle" ]; then
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.0'/" android/build.gradle
          # 如果里面没有 ext.kotlin_version，则在 buildscript 块中强行插入
          if ! grep -q "ext.kotlin_version" android/build.gradle; then
            sed -i "s/buildscript {/buildscript {\n    ext.kotlin_version = '1.9.0'/" android/build.gradle
          fi
        fi

    - name: Build APK (Release)
      run: flutter build apk --release

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: GeoFieldMapper-Release
        path: build/app/outputs/flutter-apk/app-release.apk
